[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "homebom"
version = "0.1.0"
description = "HomeBOM: Alexa+ MCP server answering 'Alexa, how safe is my home?'"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Krrish Biswas", email = "krrishbiswas175@gmail.com" }]
dependencies = [
    "homebom-core",
    "mcp>=1.3.0,<2",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "starlette>=0.38.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[tool.uv.workspace]
members = ["packages/homebom-core"]

[tool.uv.sources]
homebom-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["packages/homebom-core/tests", "tests"]
asyncio_mode = "auto"
